# Lumi Codex canary release workflow (aarch64 Apple Darwin and
# aarch64/x86_64 Linux musl), modeled
# directly on the canonical openai/codex rust-release flow: same tag gate,
# same canonical package builder
# (.github/scripts/build-codex-package-archive.sh -> scripts/build_codex_package.py),
# and the same pinned actions.
#
# Fires only on Lumi canary tags of the exact shape rust-vX.Y.Z-lumi.N. The
# tag glob below is a coarse first gate; the authoritative shape check is the
# Bash regex in the tag-check job (and re-checked at the release mutation
# point). The upstream rust-release workflow excludes these tags so they never
# start the official release graph.
#
# Runners are standard GitHub-hosted only (macos-15 for Apple Silicon and
# architecture-matched ubuntu-24.04 runners with the canonical Zig/musl
# toolchain for Linux). OpenAI's private self-hosted runners, billable GitHub
# larger runners, signing environments, credentials, and secrets are never
# used, and no macOS or Linux
# signing is claimed anywhere: every artifact below is an UNSIGNED canary.
# The fork publishes only to its own GitHub Release for this tag (fork-scoped
# GITHUB_TOKEN, no environments); the codex-zsh manifest is read from the
# immutable public openai/codex release because the fork has no zsh release
# of its own.
#
# Honest UX boundary: GitHub's /releases/latest endpoint excludes prereleases,
# so this canary is never what a no-argument installer resolves. The versioned
# one-command bootstrap for this canary is documented separately by the primary
# maintainer; this workflow must not claim otherwise. The staged install.sh
# asset is a narrow fork-aware adaptation of the canonical upstream installer;
# pin with --release or LUMI_RELEASE.

name: lumi-release

on:
  push:
    tags:
      - "rust-v*.*.*-lumi.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CODEX_ZSH_RELEASE_TAG: codex-zsh-v0.1.0

jobs:
  tag-check:
    name: Validate Lumi canary tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate tag matches Cargo.toml version
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Tag validation"

          # Release runs must come from a tag.
          [[ "${GITHUB_REF_TYPE}" == "tag" ]] \
            || { echo "❌  Not a tag ref"; exit 1; }

          # Authoritative Lumi canary tag shape: rust-vX.Y.Z-lumi.N. The
          # workflow-level tag glob is only a coarse first gate.
          [[ "${GITHUB_REF_NAME}" =~ ^rust-v[0-9]+\.[0-9]+\.[0-9]+-lumi\.[0-9]+$ ]] \
            || { echo "❌  Tag '${GITHUB_REF_NAME}' doesn't match expected format"; exit 1; }

          # The tag (minus the rust-v prefix) must equal the workspace Cargo
          # version, which itself carries the -lumi.N suffix (e.g.
          # 0.147.0-lumi.1).
          tag_ver="${GITHUB_REF_NAME#rust-v}"
          cargo_ver="$(grep -m1 '^version' codex-rs/Cargo.toml \
                        | sed -E 's/version *= *"([^"]+)".*/\1/')"

          [[ "${tag_ver}" == "${cargo_ver}" ]] \
            || { echo "❌  Tag ${tag_ver} ≠ Cargo.toml ${cargo_ver}"; exit 1; }

          echo "✅  Tag and Cargo.toml agree (${tag_ver})"
          echo "::endgroup::"

  build:
    needs: tag-check
    name: Build canary package - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # Standard hosted macOS runners can spend well over 90 minutes compiling
    # and linking the full release graph from a cold checkout. Keep enough
    # headroom for the slowest target plus packaging without using a billable
    # larger runner.
    timeout-minutes: 180
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    env:
      # Use the git CLI instead of Cargo's libgit2 path for git dependencies
      # (canonical rust-release behavior).
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Darwin: the standard public-repository macos-15 runner is an
          # arm64 host and aarch64 builds natively. Lumi publishes no x86_64
          # (Intel) macOS prebuilt. Avoid macos-15-xlarge: larger runners are
          # billable even for public repositories.
          - target: aarch64-apple-darwin
            runner: macos-15
            binaries: "codex codex-code-mode-host"
          # Linux musl: architecture-matched standard hosted runners with the
          # canonical Zig/musl toolchain (install-musl-build-tools.sh). Keep
          # aarch64 native: musl-gcc is host-architecture-specific.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            binaries: "codex codex-code-mode-host"
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            binaries: "codex codex-code-mode-host"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux bwrap build dependencies
        if: ${{ contains(matrix.target, 'linux') }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils pkg-config libcap-dev

      - name: Use hermetic Cargo home (musl)
        if: ${{ contains(matrix.target, 'linux') }}
        shell: bash
        run: |
          set -euo pipefail
          cargo_home="${GITHUB_WORKSPACE}/.cargo-home"
          mkdir -p "${cargo_home}/bin"
          echo "CARGO_HOME=${cargo_home}" >> "$GITHUB_ENV"
          echo "${cargo_home}/bin" >> "$GITHUB_PATH"
          : > "${cargo_home}/config.toml"

      - name: Install Zig
        if: ${{ contains(matrix.target, 'linux') }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      - name: Install musl build tools
        if: ${{ contains(matrix.target, 'linux') }}
        env:
          TARGET: ${{ matrix.target }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - name: Disable aws-lc jitter entropy (musl)
        if: ${{ contains(matrix.target, 'linux') }}
        shell: bash
        run: |
          set -euo pipefail
          # Avoid problematic aws-lc jitter entropy code path on musl builders.
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          target_no_jitter="AWS_LC_SYS_NO_JITTER_ENTROPY_${{ matrix.target }}"
          target_no_jitter="${target_no_jitter//-/_}"
          echo "${target_no_jitter}=1" >> "$GITHUB_ENV"

      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Build bwrap and export digest
        if: ${{ contains(matrix.target, 'linux') }}
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          cargo build --target "$target" --release --timings --bin bwrap

          bwrap_path="target/${target}/release/bwrap"
          if [[ ! -f "$bwrap_path" ]]; then
            echo "bwrap binary ${bwrap_path} not found"
            exit 1
          fi

          # Codex embeds this digest at build time and verifies the bundled
          # bwrap resource before use. Strip bwrap before hashing so the digest
          # covers the exact bytes that the release packages.
          strip --strip-debug --strip-unneeded "$bwrap_path"
          digest="$(sha256sum "$bwrap_path" | awk '{print $1}')"
          echo "CODEX_BWRAP_SHA256=${digest}" >> "$GITHUB_ENV"
          echo "Built bwrap ${bwrap_path} with sha256:${digest}"

      - name: Cargo build (canary binaries)
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          build_args=()
          for binary in ${{ matrix.binaries }}; do
            build_args+=(--bin "$binary")
          done
          cargo build --target "$target" --release --timings "${build_args[@]}"

      - name: Strip release binaries (Linux)
        if: ${{ contains(matrix.target, 'linux') }}
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          for binary in ${{ matrix.binaries }}; do
            binary_path="target/${target}/release/${binary}"
            if [[ ! -f "$binary_path" ]]; then
              echo "Binary ${binary_path} not found"
              exit 1
            fi
            strip --strip-debug --strip-unneeded "$binary_path"
          done

      - name: Download packaged zsh manifest
        shell: bash
        run: |
          set -euo pipefail
          # Immutable public upstream input (openai/codex release asset), read
          # only: the fork has no codex-zsh release of its own, and this
          # workflow never publishes to that upstream. The manifest covers the
          # four upstream Unix platforms (macos-aarch64, macos-x86_64,
          # linux-aarch64, linux-x86_64). Lumi consumes only macos-aarch64 and
          # the two Linux entries: it publishes no Intel macOS package.
          curl -fsSL \
            "https://github.com/openai/codex/releases/download/${CODEX_ZSH_RELEASE_TAG}/codex-zsh" \
            -o "${RUNNER_TEMP}/codex-zsh"

      - name: Build Codex package archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUNDLE: primary
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/.github/scripts/build-codex-package-archive.sh" \
            --target "$TARGET" \
            --bundle "$BUNDLE" \
            --entrypoint-dir "target/${TARGET}/release" \
            --archive-dir "dist/${TARGET}" \
            --zsh-manifest "${RUNNER_TEMP}/codex-zsh"

      - name: Upload canary package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-package-${{ matrix.target }}
          # Single explicit file; no globs.
          path: codex-rs/dist/${{ matrix.target }}/codex-package-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    needs: [tag-check, build]
    # Release fan-in: every matrix target must have succeeded. A matrix job
    # result is only "success" when all three target builds succeeded.
    if: >-
      ${{
        always() &&
        needs.tag-check.result == 'success' &&
        needs.build.result == 'success'
      }}
    name: Create Lumi canary GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # Only fork-scoped GITHUB_TOKEN write: required to create the release
      # and upload its five assets. actions: read is required to download
      # the build artifacts. No secrets, environments, or id-token.
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download canary packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-package-*
          path: staging
          merge-multiple: true

      - name: Stage and validate release assets
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Release asset validation"

          # Authoritative re-check: only exact rust-vX.Y.Z-lumi.N tags may
          # reach the mutation point.
          [[ "${GITHUB_REF_TYPE}" == "tag" ]] \
            || { echo "❌  Not a tag ref"; exit 1; }
          [[ "${GITHUB_REF_NAME}" =~ ^rust-v[0-9]+\.[0-9]+\.[0-9]+-lumi\.[0-9]+$ ]] \
            || { echo "❌  Tag '${GITHUB_REF_NAME}' doesn't match expected format"; exit 1; }

          version="${GITHUB_REF_NAME#rust-v}"
          targets=(
            aarch64-apple-darwin
            aarch64-unknown-linux-musl
            x86_64-unknown-linux-musl
          )

          # 1. Every target archive must be present exactly once.
          for target in "${targets[@]}"; do
            archive="staging/codex-package-${target}.tar.gz"
            [[ -f "$archive" && ! -L "$archive" ]] \
              || { echo "Missing downloaded package archive: ${archive}"; exit 1; }
          done
          [[ "$(find staging -maxdepth 1 -type f -name 'codex-package-*.tar.gz' | wc -l)" \
             -eq "${#targets[@]}" ]] \
            || { echo "Expected exactly ${#targets[@]} package archives in staging"; exit 1; }

          # 2. Canonical checksum manifest: one line per target archive in the
          #    standard sha256sum "<digest>  <name>" format that install.sh
          #    parses, verified with sha256sum -c.
          manifest="staging/codex-package_SHA256SUMS"
          (cd staging && for target in "${targets[@]}"; do
            sha256sum "codex-package-${target}.tar.gz"
          done | sort -k2 > codex-package_SHA256SUMS)
          [[ "$(wc -l < "$manifest")" -eq "${#targets[@]}" ]] \
            || { echo "Checksum manifest must contain exactly ${#targets[@]} lines"; exit 1; }
          (cd staging && sha256sum -c codex-package_SHA256SUMS)

          # 3. Installer asset: exact canonical repository copy, with a POSIX
          #    syntax check before publication.
          cp scripts/install/install.sh staging/install.sh
          sh -n staging/install.sh

          # 4. Validate every archive before release: safe member names and
          #    types, exact canonical eight-field metadata, required regular
          #    executables, correct binary architecture, and the exact tag
          #    version embedded in the entrypoint. Cross-built binaries are
          #    validated statically here; the one natively executable archive
          #    additionally gets an execution check below.
          extract_root="${RUNNER_TEMP}/lumi-canary-packages"
          rm -rf "$extract_root"
          mkdir -p "$extract_root"
          python3 - "$extract_root" "staging" "${version}" "${targets[@]}" <<'PY'
          import json
          import pathlib
          import stat
          import struct
          import sys
          import tarfile

          extract_root = pathlib.Path(sys.argv[1])
          staging = pathlib.Path(sys.argv[2])
          version = sys.argv[3]
          targets = sys.argv[4:]

          MACH_O_MAGIC_64 = b"\xcf\xfa\xed\xfe"
          ELF_MAGIC = b"\x7fELF"
          CPU_TYPE_ARM64 = 0x0100000C
          EM_X86_64 = 62
          EM_AARCH64 = 183


          def check_archive_members(archive: pathlib.Path) -> None:
              # Reject absolute members, empty names, and any `..` component;
              # only regular files and directories may be extracted.
              with tarfile.open(archive, "r:gz") as tf:
                  for member in tf.getmembers():
                      name = member.name
                      if (
                          name == ""
                          or name.startswith("/")
                          or any(part == ".." for part in name.split("/"))
                      ):
                          raise SystemExit(f"Unsafe member name in {archive.name}: {name!r}")
                      if not member.isfile() and not member.isdir():
                          raise SystemExit(f"Unsafe member type in {archive.name}: {name!r}")


          def require_regular_executable(root: pathlib.Path, relative: str) -> None:
              path = root / relative
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"Missing or invalid package file: {relative}")
              if not path.stat().st_mode & stat.S_IXUSR:
                  raise SystemExit(f"Package file is not executable: {relative}")


          def check_arch(path: pathlib.Path, target: str) -> None:
              data = path.read_bytes()
              if target.endswith("apple-darwin"):
                  if data[:4] != MACH_O_MAGIC_64:
                      raise SystemExit(f"{path} is not a 64-bit Mach-O binary")
                  cputype = struct.unpack("<I", data[4:8])[0]
                  expected = CPU_TYPE_ARM64
                  if cputype != expected:
                      raise SystemExit(f"{path} has wrong Mach-O cputype {cputype:#x}")
              else:
                  if data[:4] != ELF_MAGIC or data[4] != 2:
                      raise SystemExit(f"{path} is not a 64-bit ELF binary")
                  machine = struct.unpack("<H", data[18:20])[0]
                  expected = EM_AARCH64 if target.startswith("aarch64") else EM_X86_64
                  if machine != expected:
                      raise SystemExit(f"{path} has wrong ELF machine {machine}")


          for target in targets:
              archive = staging / f"codex-package-{target}.tar.gz"
              check_archive_members(archive)

              extract_dir = extract_root / target
              extract_dir.mkdir(parents=True, exist_ok=True)
              tarfile.open(archive, "r:gz").extractall(extract_dir, filter="data")

              # Canonical metadata: the parsed JSON object must equal the
              # eight-field schema exactly, so missing, extra, or regex-decoy
              # fields all fail.
              pkgjson = extract_dir / "codex-package.json"
              if not pkgjson.is_file() or pkgjson.is_symlink():
                  raise SystemExit(
                      f"Missing package metadata in {target}: codex-package.json"
                  )
              metadata = json.loads(pkgjson.read_text(encoding="utf-8"))
              expected = {
                  "layoutVersion": 1,
                  "distribution": "lumi",
                  "version": version,
                  "target": target,
                  "variant": "codex",
                  "entrypoint": "bin/codex",
                  "resourcesDir": "codex-resources",
                  "pathDir": "codex-path",
              }
              if metadata != expected:
                  raise SystemExit(
                      "Invalid package metadata: expected the canonical "
                      f"eight-field schema {expected!r}, got {metadata!r}"
                  )

              # Required regular executables: regular files, not symlinks.
              require_regular_executable(extract_dir, "bin/codex")
              require_regular_executable(extract_dir, "bin/codex-code-mode-host")
              require_regular_executable(extract_dir, "codex-path/rg")
              require_regular_executable(extract_dir, "codex-resources/zsh/bin/zsh")
              if target.endswith("unknown-linux-musl"):
                  require_regular_executable(extract_dir, "codex-resources/bwrap")

              # Binary architecture must match the package target.
              check_arch(extract_dir / "bin/codex", target)
              check_arch(extract_dir / "bin/codex-code-mode-host", target)

              # The exact tag version must be embedded in the entrypoint
              # (fixed byte search; cross-built binaries are not executed).
              if version.encode("utf-8") not in (
                  extract_dir / "bin/codex"
              ).read_bytes():
                  raise SystemExit(
                      f"bin/codex in {target} does not embed version {version}"
                  )

              print(f"✅  Validated canonical package for {target} ({version})")
          PY

          # 5. Execute the archive that is natively runnable on this runner
          #    (x86_64-unknown-linux-musl on the x86_64 ubuntu release
          #    runner). The remaining targets are cross-built and are
          #    validated statically above; running them here would require
          #    emulation that is not available.
          target="x86_64-unknown-linux-musl"
          binary_version="$( "${extract_root}/${target}/bin/codex" --version 2>/dev/null \
            | sed -n 's/.* \([0-9][0-9A-Za-z.+-]*\)$/\1/p' \
            | head -n 1 )"
          [[ -n "${binary_version}" ]] \
            || { echo "codex --version produced no version"; exit 1; }
          [[ "${binary_version}" == "${version}" ]] \
            || { echo "Binary version ${binary_version} ≠ tag version ${version}"; exit 1; }
          echo "✅  Native binary version agrees (${version})"

          # 6. Staging must contain exactly the five intended release files.
          count="$(find staging -maxdepth 1 -type f | wc -l)"
          [[ "$count" -eq 5 ]] \
            || { echo "Expected exactly 5 files in staging, found ${count}"; exit 1; }
          for name in \
            "codex-package-aarch64-apple-darwin.tar.gz" \
            "codex-package-aarch64-unknown-linux-musl.tar.gz" \
            "codex-package-x86_64-unknown-linux-musl.tar.gz" \
            "codex-package_SHA256SUMS" \
            "install.sh"
          do
            [[ -f "staging/${name}" && ! -L "staging/${name}" ]] \
              || { echo "Missing staged release file: ${name}"; exit 1; }
          done

          echo "✅  Staged exactly five assets for ${GITHUB_REF_NAME}"
          echo "::endgroup::"

      - name: Fail if the release already exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; refusing to mutate an immutable canary release." >&2
            exit 1
          fi
          echo "Release ${GITHUB_REF_NAME} does not exist yet; proceeding."

      - name: Create immutable GitHub prerelease
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |-
            Lumi Codex canary prerelease (${{ github.ref_name }}).

            Assets:
            - `codex-package-aarch64-apple-darwin.tar.gz` — canonical Codex package for aarch64-apple-darwin
            - `codex-package-aarch64-unknown-linux-musl.tar.gz` — canonical Codex package for aarch64-unknown-linux-musl
            - `codex-package-x86_64-unknown-linux-musl.tar.gz` — canonical Codex package for x86_64-unknown-linux-musl
            - `codex-package_SHA256SUMS` — SHA-256 manifest for the package archives
            - `install.sh` — fork-aware canonical Codex Unix installer (pin with `--release` or `LUMI_RELEASE`)

            Note: this is a prerelease, so GitHub's `/releases/latest` never resolves to it. All artifacts are unsigned canaries: no macOS code signing/notarization and no Linux signature claims.
          files: |
            staging/codex-package-aarch64-apple-darwin.tar.gz
            staging/codex-package-aarch64-unknown-linux-musl.tar.gz
            staging/codex-package-x86_64-unknown-linux-musl.tar.gz
            staging/codex-package_SHA256SUMS
            staging/install.sh
          fail_on_unmatched_files: true
          # Never clobber assets on an existing release; the pre-check above
          # already fails when the release exists.
          overwrite_files: false
          make_latest: false
          prerelease: true

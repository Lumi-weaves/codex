name: v8-canary

# This is an intentionally manual diagnostic. It downloads the checksum-pinned
# published release/sandbox artifact pairs for the resolved rusty_v8 version
# and smoke-tests each pair with Cargo, instead of cold-building V8. A live
# fork run showed that two cold hosted Linux builds were still running after
# 75 minutes without OpenAI's BuildBuddy topology, so V8 compilation is not
# an automatic Lumi CI gate. Distribution architectures are covered by the
# shadow/release contract; Windows and Intel macOS are unsupported.
on:
  workflow_dispatch:

concurrency:
  # Use a literal family name so this workflow never contends with
  # `blocking-ci` for the same concurrency slot.
  group: v8-canary::${{ github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      # Older revisions can contain a detector that does not emit this output.
      # Missing must mean "run" so they cannot silently skip the expensive V8
      # coverage while reporting success.
      canary_required: ${{ steps.changes.outputs.canary_required || 'true' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Detect V8 canary changes
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # Manual runs have no meaningful before/after range. Force every V8
          # variant so workflow_dispatch remains a reliable retry path.
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            output="$(python3 .github/scripts/v8_canary_changes.py --force)"
          else
            output="$(python3 .github/scripts/v8_canary_changes.py \
              --base "${BASE_SHA}" \
              --head "${HEAD_SHA}")"
          fi
          echo "${output}"
          echo "${output}" >> "${GITHUB_OUTPUT}"

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  verify:
    name: Verify ${{ matrix.variant }} ${{ matrix.target }}
    needs: metadata
    # Metadata always runs; only relevant changes pay for the matrix.
    if: ${{ needs.metadata.outputs.canary_required == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            sandbox: false
            target: x86_64-unknown-linux-gnu
            variant: release
          - runner: ubuntu-24.04
            sandbox: true
            target: x86_64-unknown-linux-gnu
            variant: ptrcomp-sandbox
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Rust toolchain for Cargo smoke
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: "1.95.0"

      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}
          sandbox: ${{ matrix.sandbox }}

      - name: Smoke test downloaded artifacts with Cargo
        env:
          SANDBOX: ${{ matrix.sandbox }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RUSTY_V8_ARCHIVE:-}" || -z "${RUSTY_V8_SRC_BINDING_PATH:-}" ]]; then
            echo "setup-rusty-v8 did not export artifact overrides for ${TARGET}." >&2
            exit 1
          fi

          cargo_args=(test -p codex-v8-poc)
          if [[ "${SANDBOX}" == "true" ]]; then
            cargo_args+=(--features sandbox)
          fi

          (
            cd codex-rs
            CARGO_TARGET_DIR="${RUNNER_TEMP}/rusty-v8-cargo-smoke-${TARGET}-${SANDBOX}" \
            cargo "${cargo_args[@]}"
          )

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
